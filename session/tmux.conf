# セッションコンテナの tmux 設定 (/etc/tmux.conf に置く)。
# 復元は tmux-resurrect の restore.sh を使う (entrypoint が起動時に呼ぶ)。TPM は使わず、イメージに固定版を置いて直接読み込む。
# 保存は自前の tmux-state が resurrect と同じ形式で書く (resurrect の save.sh は重いので使わない)。
# 保存の時期は entrypoint の毎秒の見回りと、下の tmux フック。
# (tmux-continuum は使わない。自動復元は起動直後に他の tmux クライアントが居ると黙ってやめ、
#  定期保存は attach している端末が無いと動かず、間隔も分単位でしか決められないため。)

# セッションが 0 個でもサーバーを残す。コンテナの寿命は「tmux サーバーが生きている間」。
set -g exit-empty off
set -g history-limit 50000
set -g mouse on

set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
# 古い保存ファイルは tmux-state が数で消す (既定 120 個)。resurrect 自身の日数での削除は、
# グループ化したセッションがあって resurrect の save.sh に任せたときの保険
set -g @resurrect-delete-backup-after '7'

# Claude Code の会話の復元 (/usr/local/bin/claude-pane)。
#   pre-restore  復元中の旗を立てる (その間は保存しない)
#   restore      対応表のペインで claude を起動し、旗を下ろして @restore-finished を立てる
# (位置基準の対応表の書き直しは、tmux-state が構成を書いた直後に claude-pane save を呼んで行う)
set -g @resurrect-hook-pre-restore-all 'claude-pane pre-restore'
set -g @resurrect-hook-post-restore-all 'claude-pane restore'

run-shell /opt/tmux-plugins/tmux-resurrect/resurrect.tmux

# prefix + C-s も tmux-state を通す (復元中・停止中は保存しない、重ねない)
bind-key C-s run-shell -b 'tmux-state save'

# 構成が変わったらすぐ保存する (毎秒の見回りを待たずに)。tmux 3.8 のフックを使う。
# -b で裏で走らせる。続けて起きても tmux-state が 1 回にまとめる。復元中・停止中は tmux-state が何もしない。
# 操作と起きるフック (3.8 で確認):
#   split-window → pane-created      exit でペインを閉じる → pane-exited    kill-pane → after-kill-pane
#   new-window → window-linked       kill-window・移動・break-pane → window-unlinked
#   swap-pane・break-pane → pane-moved   new/kill/rename-session → session-created/closed/renamed
set-hook -g pane-created 'run-shell -b "tmux-state save"'
set-hook -g pane-exited 'run-shell -b "tmux-state save"'
set-hook -g pane-moved 'run-shell -b "tmux-state save"'
set-hook -g after-kill-pane 'run-shell -b "tmux-state save"'
set-hook -g window-linked 'run-shell -b "tmux-state save"'
set-hook -g window-unlinked 'run-shell -b "tmux-state save"'
set-hook -g session-created 'run-shell -b "tmux-state save"'
set-hook -g session-closed 'run-shell -b "tmux-state save"'
set-hook -g session-renamed 'run-shell -b "tmux-state save"'
# 付けないもの (毎秒の見回りに任せる):
#   window-renamed・window-layout-changed  automatic-rename やリサイズのたびに起き、保存が走り続ける
#   pane-activity                          出力のたびに起き、間引かれない (0.1 秒ごとの出力で 3 秒に 32 回)
#   set-hook -B (毎秒の監視)                attach が無いと 1 つのセッションしか見ない

# claude が動いているのに会話の記録が付かないペインがあれば、ステータス行の右に出す (claude-pane check が立てる)
set -g status-right-length 120
set -g status-right '#{?@claude_pane_warn,#[fg=colour231 bg=colour160] claude 未記録: #{@claude_pane_warn} #[default] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'
